<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>boot probe</title></head>
<body>
<div id="menu"></div>
<div id="game" class="hidden"><canvas id="view"></canvas></div>
<div id="probe-log" style="position:absolute;left:0;top:0;z-index:9999;background:white;color:black;font:12px monospace;white-space:pre;max-height:100vh;overflow:auto"></div>
<script>
  const log = (s) => { document.getElementById("probe-log").textContent += s + "\n"; };
  window.addEventListener("error", (e) => log("ERR: " + e.message + " @" + (e.filename||"") + ":" + e.lineno));
  window.addEventListener("unhandledrejection", (e) => log("REJ: " + e.reason && e.reason.message ? e.reason : e));
  import("./js/main.js").then(() => log("MODULE: main.js loaded")).catch((e) => log("MODULE-ERR: " + e));
  setTimeout(() => {
    log("BOOTED: " + window.__woetBooted);
    const m = document.getElementById("menu");
    log("MENU children: " + (m ? m.children.length : null));
    const g = document.getElementById("game");
    const started = (window.WOTE && window.WOTE.g && !window.WOTE.g.winner);
    log("WOTE hook: " + !!(window.WOTE));
    log("RESULT: " + (window.__woetBooted ? "BOOT OK" : "BOOT FAILED"));
  }, 3000);
</script>
</body>
</html>
